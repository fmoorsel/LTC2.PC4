<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Long term NL challenge 2</title>
</head>

<body>
    <script>
        const now = new Date();
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);

        const t = urlParams.get('t'); 
        const strava = urlParams.get('strava');
        const ridewithgps = urlParams.get('ridewithgps');

        const parameter = (ridewithgps ? "ridewithgps" : strava ? "strava" : "t") + '=' + now.getTime();

        window.location = "../ltc2-main/index.html?" + parameter;
    </script>
</body>
</html>
